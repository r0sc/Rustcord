# Netlify builds the website (site/) on every push to main: https://rustcord.netlify.app/
[build]
  command = "sh scripts/build-site.sh"
  publish = "_site"

[build.environment]
  # The image default is 24 too, but a version picked in the UI would win over it.
  NODE_VERSION = "24"

# Exit 0 skips the build. This skips only when an earlier, different commit was built and
# neither the changes since then nor the pushed commit touch the site's inputs.
# Everything else builds: a first build, a cleared cache, a retry, a commit git cannot find.
[context.production]
  ignore = 'p="site docs/screenshots assets scripts/build-site.sh netlify.toml"; test -n "$CACHED_COMMIT_REF" && test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- $p && git diff --quiet "$COMMIT_REF^" "$COMMIT_REF" -- $p'
