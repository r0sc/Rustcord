[package]
name = "rustcord"
version = "0.1.6"
edition = "2024"
# src/bin/rustcord-setup is the installer (scripts/build-installer.ps1 packs the app into it).
default-run = "rustcord"

[dependencies]
aes-gcm = "=0.10.3"
base64 = "0.23.1"
chacha20poly1305 = "=0.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cpal = "=0.18.2"
davey = "=0.2.0"
directories = "6.0.0"
# Self-updater: verifies the signed update feed (approved; already in the tree via openmls).
ed25519-dalek = "2.2"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard", "links", "wayland", "x11"] }
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
# Unicode emoji table (shortcodes, groups, skin tones) for the picker and `:shortcode:` (approved).
emojis = "0.9.1"
epaint = { version = "0.37.0", default-features = false, features = ["color_fonts"] }
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# OS RNG for the per-QR-code RSA key (already in the tree via rsa).
getrandom = { version = "0.4", features = ["sys_rng"] }
# png, gif: what image already decodes with; the streamed effect and banner frames use them directly (cache/images.rs).
png = "0.18.1"
gif = "0.14.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
keyring = "4.2"
# H.264 encode/decode for camera / screen share (approved; builds C++ with MSVC). docs/VIDEO_DESIGN.md
openh264 = "=0.9.10"
opus-rs = "=0.1.42"
percent-encoding = "2.3.2"
qrcodegen = "1.8.0"
# MP4/MOV demux for in-app video playback (sample tables with sync flags and CTS; approved). docs/MEDIA_DESIGN.md
re_mp4 = "=0.5.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "gzip"] }
rfd = "0.18.0"
rsa = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Self-updater: version compare of the update feed (approved; already in the tree via rustc_version).
semver = "1.0"
sha2 = "0.11.1"
# cmap lookups for the system font fallback chain: the version epaint already builds (approved).
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# AAC-LC decode for in-app video sound (pure Rust, MPL-2.0 unmodified; approved). docs/MEDIA_DESIGN.md
symphonia-codec-aac = "=0.6.1"
# Codec parameters and audio buffers that the AAC decoder takes and returns (approved).
symphonia-core = "=0.6.1"
# `net`: voice UDP socket.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
toml = "1.2.1"
# WOFF2 -> sfnt for gg sans, decoded in memory at runtime (docs/FONTS_NOTES.md; ~330 KiB with its 2 deps, approved).
wuff = { version = "=0.2.10", default-features = false, features = ["brotli"] }
zeroize = "1.9.1"

[target."cfg(windows)".dependencies]
# Camera capture via Media Foundation: same 0.62.2 as cpal's, features only (approved).
# Win32_Graphics_Dwm: hide cloaked windows from the screen-share list. Direct3D11 + Dxgi_Common:
# the screen share's reused staging texture (windows-capture builds them already).
# Media_Control + Storage_Streams: the system media session for the user panel's music controls.
# Security_Credentials_UI + Win32_System_WinRT: Windows Hello for the app lock.
# Win32_Media_Speech: SAPI voice for the VcNarrator plugin. Win32_UI_Shell: the installer's
# shortcuts (IShellLinkW) and known folders.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Media_Control", "Security_Credentials_UI", "Storage_Streams", "Win32_Media_Speech", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell"] }
# Screen / window capture (Windows Graphics Capture; approved).
windows-capture = "=2.0.1"
# Win32_System_SystemInformation: GetTickCount for the CustomIdle plugin's idle time.
# Registry: autostart + the installer's Apps entry. Threading + Security: the single-instance mutex.
# Diagnostics_ToolHelp (+ Threading): the process list of game detection (src/activity/scan.rs).
# Globalization: GetUserDefaultLocaleName for the Translate plugin's "App language" fallback.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_Globalization"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Discord's hCaptcha inside the login card: a child webview of Rustcord's window (docs/AUTH_NOTES.md
# section 0). Pinned: the Windows page origin relies on its `https://<protocol>.*` mapping. No default
# features: they only add Linux WebKitGTK.
wry = { version = "=0.57.2", default-features = false }

[target."cfg(windows)".build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(unix)'.dependencies]
# mmap of font files, malloc_trim, /proc and libproc process lists (already built by eframe/cpal).
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
# Tray icon (StatusNotifierItem over D-Bus); async-io like keyring's zbus, never the tokio default.
ksni = { version = "=0.3.7", default-features = false, features = ["async-io", "blocking"] }
# Notifications (org.freedesktop.Notifications): the zbus keyring/accesskit already build.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# Force X11 (XWayland): Wayland can't hide, un-minimize or focus a window (close to tray).
winit = { version = "0.30.13", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Menu bar icon + menu (NSStatusItem), on the main thread.
tray-icon = { version = "=0.26.1", default-features = false }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNError"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSString", "NSNotification", "NSOperation", "NSURL", "block2"] }
# The captcha page's discord.com base URL (wry loads HTML without one).
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKNavigation", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }

[dev-dependencies]
resvg = { version = "0.49.0", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false

# Keep image decoding usable in debug builds.
[profile.dev.package."*"]
opt-level = 2

# tls_codec debug_asserts on a malformed MLS length byte (from the voice server) right before
# returning the error release builds return: a bad DAVE frame must not panic debug builds.
[profile.dev.package.tls_codec]
opt-level = 2
debug-assertions = false
